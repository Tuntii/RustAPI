# Low-memory build defaults for local development.
#
# This workspace has 13 crates. With 16 logical CPUs, Cargo defaults to 16
# parallel rustc processes — each can use 1–4+ GB RAM during LLVM/codegen.
# On a ~16 GB machine that routinely causes swap thrashing and Windows BSODs.
#
# Local low-memory default (Windows ~16 GB machines):
#   set CARGO_BUILD_JOBS=2   # PowerShell / cmd
#   export CARGO_BUILD_JOBS=2  # bash
# Or uncomment in .env.example. CI uses Cargo's default (all CPUs).

[build]
incremental = true

[alias]
# Dev / check / lint (respects [build].jobs above)
check-all = "check --workspace --all-targets"
clippy-all = "clippy --workspace --all-targets -- -D warnings"

# Release without fat LTO — avoids 8–16 GB link-step RAM spikes on Windows
release-safe = "build --profile release-low-mem --workspace"
release-safe-pkg = "build --profile release-low-mem -p"

# Single-crate iteration (much lighter than --workspace)
dev-core = "build -p rustapi-core"
dev-rs = "build -p rustapi-rs"